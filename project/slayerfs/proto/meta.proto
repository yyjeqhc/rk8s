syntax = "proto3";

package slayerfs.meta;

// Metadata Service
service MetaService {
    // Initialize the metadata store
    rpc Initialize(InitializeRequest) returns (InitializeResponse);
    
    // Get root inode
    rpc GetRootIno(GetRootInoRequest) returns (GetRootInoResponse);
    
    // Get file attributes
    rpc GetAttr(GetAttrRequest) returns (GetAttrResponse);
    
    // Get attributes for multiple inodes (batch)
    rpc GetAttrBatch(GetAttrBatchRequest) returns (GetAttrBatchResponse);
    
    // Look up directory entry by name
    rpc Lookup(LookupRequest) returns (LookupResponse);
    
    // Read directory entries
    rpc Readdir(ReaddirRequest) returns (ReaddirResponse);
    
    // Read directory entries with attributes (optimized)
    rpc ReaddirPlus(ReaddirPlusRequest) returns (ReaddirPlusResponse);
    
    // Create file or directory
    rpc Create(CreateRequest) returns (CreateResponse);
    
    // Set file attributes
    rpc SetAttr(SetAttrRequest) returns (SetAttrResponse);
    
    // Rename/move file or directory
    rpc Rename(RenameRequest) returns (RenameResponse);
    
    // Remove file
    rpc Unlink(UnlinkRequest) returns (UnlinkResponse);
    
    // Remove directory
    rpc Rmdir(RmdirRequest) returns (RmdirResponse);
}

// Common types

message FileAttr {
    int64 ino = 1;
    uint64 size = 2;
    FileType kind = 3;
    uint32 mode = 4;
    uint32 uid = 5;
    uint32 gid = 6;
    int64 atime = 7;
    int64 mtime = 8;
    int64 ctime = 9;
    uint32 nlink = 10;
    uint64 blocks = 11;
    uint32 blksize = 12;
    uint32 rdev = 13;
    uint64 version = 14;
}

enum FileType {
    FILE_TYPE_UNSPECIFIED = 0;
    FILE_TYPE_FILE = 1;
    FILE_TYPE_DIR = 2;
}

message DirEntry {
    string name = 1;
    int64 ino = 2;
    FileType kind = 3;
}

// Request/Response messages

message InitializeRequest {}

message InitializeResponse {
    bool success = 1;
}

message GetRootInoRequest {}

message GetRootInoResponse {
    int64 ino = 1;
}

message GetAttrRequest {
    int64 ino = 1;
}

message GetAttrResponse {
    FileAttr attr = 1;
}

message GetAttrBatchRequest {
    repeated int64 inos = 1;
}

message GetAttrBatchResponse {
    repeated AttrPair attrs = 1;
}

message AttrPair {
    int64 ino = 1;
    FileAttr attr = 2;
}

message LookupRequest {
    int64 parent = 1;
    string name = 2;
}

message LookupResponse {
    int64 ino = 1;
}

message ReaddirRequest {
    int64 ino = 1;
}

message ReaddirResponse {
    repeated DirEntry entries = 1;
}

message ReaddirPlusRequest {
    int64 ino = 1;
}

message ReaddirPlusResponse {
    repeated DirEntryPlus entries = 1;
}

message DirEntryPlus {
    DirEntry entry = 1;
    FileAttr attr = 2;
}

message CreateRequest {
    int64 parent = 1;
    string name = 2;
    FileType kind = 3;
    uint32 mode = 4;
    uint32 uid = 5;
    uint32 gid = 6;
    uint32 rdev = 7;
}

message CreateResponse {
    int64 ino = 1;
    FileAttr attr = 2;
}

message SetAttrRequest {
    int64 ino = 1;
    optional uint64 size = 2;
    optional uint32 mode = 3;
    optional uint32 uid = 4;
    optional uint32 gid = 5;
    optional int64 atime = 6;
    optional int64 mtime = 7;
}

message SetAttrResponse {
    FileAttr attr = 1;
}

message RenameRequest {
    int64 old_parent = 1;
    string old_name = 2;
    int64 new_parent = 3;
    string new_name = 4;
}

message RenameResponse {
    bool success = 1;
}

message UnlinkRequest {
    int64 parent = 1;
    string name = 2;
}

message UnlinkResponse {
    bool success = 1;
}

message RmdirRequest {
    int64 parent = 1;
    string name = 2;
}

message RmdirResponse {
    bool success = 1;
}
